<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="A roaring cartoon Tyrannosaurus running toward the right">
  <rect width="960" height="600" rx="40" fill="#e7f6cf"/>
  <circle cx="108" cy="92" r="44" fill="#ffd15c" stroke="#1c1630" stroke-width="7"/>
  <path d="M0 512c180-48 300 16 480-24 190-36 300 28 480-12v124H0z" fill="#b6e07a"/>
  <path d="M0 520h960" stroke="#1c1630" stroke-width="8"/>

  <!-- planted hind leg, pushing off -->
  <g stroke="#1c1630" stroke-width="8" stroke-linejoin="round">
    <path d="M188 348c-8 62-28 118 4 168h96c22-52 28-108 36-160-40 8-96 4-136-8z" fill="#1f7a36"/>
    <path d="M128 500h230c14 6 18 26 6 40H112c-14-10-8-32 16-40z" fill="#f4e3b4"/>
    <path d="M168 528l-10 32M230 532l-2 34M292 526l12 28" fill="none" stroke-linecap="round" stroke-width="8"/>
  </g>
  <g fill="#f6e7c4" opacity="0.95">
    <ellipse cx="210" cy="548" rx="34" ry="12"/>
    <ellipse cx="150" cy="536" rx="22" ry="8"/>
  </g>

  <!-- tail, held out for balance -->
  <path d="M36 292c78-78 170-46 268-62 18 28 16 66-2 102-92 28-190 18-266 42-18-22-14-58 0-82z" fill="#2c9644" stroke="#1c1630" stroke-width="8" stroke-linejoin="round"/>

  <!-- torso -->
  <path d="M250 236c96-78 230-86 348-36 28 22 36 74 12 122-46 54-168 86-286 68-78-12-112-78-74-154z" fill="#3cba55" stroke="#1c1630" stroke-width="8" stroke-linejoin="round"/>
  <path d="M320 318c86 18 176 6 236-36-8 42-70 74-164 80-74 6-132-12-158-36 22-8 56-10 86-8z" fill="#dff6b4" stroke="#1c1630" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#1d7a38">
    <ellipse cx="340" cy="250" rx="22" ry="14"/>
    <ellipse cx="410" cy="268" rx="16" ry="11"/>
    <ellipse cx="250" cy="300" rx="14" ry="9"/>
  </g>

  <!-- lifted hind leg -->
  <g stroke="#1c1630" stroke-width="8" stroke-linejoin="round">
    <path d="M455 300c52 18 92 58 86 112-28 8-48-6-58-28-16-36-8-70 8-96-16-2-28 2-36 12z" fill="#35ad4e"/>
    <path d="M500 392c48-28 108-16 142 10 10 8-8 24-24 18-36-14-82-10-118 2-10 4-16-16 0-30z" fill="#f4e3b4"/>
    <path d="M612 392l18 16M648 404l16 14" fill="none" stroke-linecap="round" stroke-width="6"/>
  </g>

  <!-- tiny two-fingered arm -->
  <path d="M530 248c46 4 58 32 28 48-22 12-44-2-50-22-6-16 0-28 22-26z" fill="#248a3e" stroke="#1c1630" stroke-width="7" stroke-linejoin="round"/>
  <path d="M512 276c-18 4-22 14-10 20M528 294c-16 8-18 16-6 20" fill="none" stroke="#1c1630" stroke-width="6" stroke-linecap="round"/>

  <!-- open roar: pink mouth sits between the jaws -->
  <path d="M610 228c100-28 210-16 300 18-8 70-30 130-40 168-100-48-200-86-270-100 4-30 6-58 10-86z" fill="#f6b4c2" stroke="#1c1630" stroke-width="6" stroke-linejoin="round"/>
  <path d="M760 300c30 8 58 22 78 40-20 10-48 6-70-6-16-8-22-22-8-34z" fill="#e9899c"/>

  <!-- huge upper skull -->
  <path d="M545 240c28-120 150-178 320-162 78 8 128 52 116 102-8 22-46 30-78 22-78-20-168-6-250 36-28 16-80 22-108 2z" fill="#3cba55" stroke="#1c1630" stroke-width="8" stroke-linejoin="round"/>
  <!-- dropped lower jaw -->
  <path d="M590 318c90 36 196 82 300 122 22 10 16 40-20 34-108-36-214-82-292-118-20-10-12-32 12-38z" fill="#46c262" stroke="#1c1630" stroke-width="8" stroke-linejoin="round"/>

  <!-- teeth -->
  <g fill="#fffdf8" stroke="#1c1630" stroke-width="3.5" stroke-linejoin="round">
    <path d="M648 214l16 40 16-36z"/>
    <path d="M702 204l16 44 16-40z"/>
    <path d="M756 196l15 44 16-40z"/>
    <path d="M808 188l14 42 15-38z"/>
    <path d="M856 182l12 36 14-34z"/>
    <path d="M662 308l14-32 14 36z"/>
    <path d="M724 332l14-34 14 38z"/>
    <path d="M786 358l13-32 14 36z"/>
    <path d="M842 382l12-28 13 32z"/>
  </g>

  <!-- eye and snout -->
  <path d="M668 108c36-34 96-28 140 8" fill="none" stroke="#1c1630" stroke-width="11" stroke-linecap="round"/>
  <circle cx="748" cy="138" r="30" fill="#fffdf8" stroke="#1c1630" stroke-width="7"/>
  <circle cx="760" cy="142" r="13" fill="#1c1630"/>
  <circle cx="766" cy="136" r="5" fill="#fff"/>
  <ellipse cx="900" cy="132" rx="12" ry="8" fill="#1c1630"/>
</svg>
