<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="A tall steel ship descending on bright landing flames">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1440"/>
      <stop offset="0.55" stop-color="#3a2bb5"/>
      <stop offset="1" stop-color="#6a3a78"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b98a6"/>
      <stop offset="0.28" stop-color="#f4f7fb"/>
      <stop offset="0.62" stop-color="#d5dee6"/>
      <stop offset="1" stop-color="#7d8b99"/>
    </linearGradient>
    <linearGradient id="tiles" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#1c2430"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.28" stop-color="#ffc107"/>
      <stop offset="0.62" stop-color="#ff6b2c"/>
      <stop offset="1" stop-color="#c1121f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffe66d"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="520" rx="36" fill="url(#sky)"/>
  <g fill="#fff6d8">
    <circle cx="48" cy="54" r="2.2"/>
    <circle cx="92" cy="96" r="1.6"/>
    <circle cx="140" cy="42" r="2"/>
    <circle cx="250" cy="70" r="1.5"/>
    <circle cx="310" cy="38" r="2.4"/>
    <circle cx="348" cy="110" r="1.6"/>
    <circle cx="64" cy="160" r="1.4"/>
    <circle cx="332" cy="168" r="1.8"/>
  </g>
  <ellipse cx="200" cy="458" rx="150" ry="28" fill="#4a2418"/>
  <ellipse cx="200" cy="448" rx="108" ry="18" fill="#ffb703" opacity="0.85"/>
  <ellipse cx="200" cy="444" rx="62" ry="10" fill="#fff1b8"/>

  <!-- landing flames, behind the ship -->
  <path d="M118 360c-8 36-6 78 18 112 8-28 22-52 28-86 4-22-10-28-18-26-10 2-22 0-28 0z" fill="url(#flame)"/>
  <path d="M168 352c-6 48 4 96 32 128 10-36 16-70 12-104-2-18-22-26-32-24-6 1-10 0-12 0z" fill="url(#flame)"/>
  <path d="M250 360c10 34 8 74-8 112-12-30-24-58-22-90 1-20 16-24 24-22 4 1 6 0 6 0z" fill="url(#flame)"/>
  <path d="M178 358c2 40 10 78 22 108 6-34 8-66 4-96-2-16-16-16-22-12-2 1-4 0-4 0z" fill="url(#core)"/>
  <path d="M132 368c0 28 6 52 14 74 4-22 8-42 6-62-1-10-12-14-16-12-2 1-4 0-4 0z" fill="url(#core)"/>

  <!-- aft flaps -->
  <path d="M156 268 62 332l22 52 86-58z" fill="#c5d0da" stroke="#1c1630" stroke-width="6" stroke-linejoin="round"/>
  <path d="M244 268 338 332l-22 52-86-58z" fill="#9aa8b5" stroke="#1c1630" stroke-width="6" stroke-linejoin="round"/>
  <path d="M150 286 86 332" fill="none" stroke="#1c1630" stroke-width="3"/>
  <path d="M250 286 314 332" fill="none" stroke="#1c1630" stroke-width="3"/>

  <!-- forward flaps -->
  <path d="M158 148 78 176l16 42 70-28z" fill="#e7eef4" stroke="#1c1630" stroke-width="6" stroke-linejoin="round"/>
  <path d="M242 148 322 176l-16 42-70-28z" fill="#b7c4d0" stroke="#1c1630" stroke-width="6" stroke-linejoin="round"/>

  <!-- hull -->
  <path d="M158 156v176c0 22 18 36 42 40 24-4 42-18 42-40V156c0-62-16-112-42-128-26 16-42 66-42 128z" fill="url(#steel)" stroke="#1c1630" stroke-width="6" stroke-linejoin="round"/>
  <path d="M200 36c18 14 34 58 38 114v170c0 16-10 28-22 34V48c-4-6-10-10-16-12z" fill="url(#tiles)"/>
  <g fill="none" stroke="#1c1630" stroke-width="2" opacity="0.55">
    <path d="M168 150h32M168 186h32M168 222h32M168 258h32M168 294h32"/>
    <path d="M206 150h28M206 186h30M206 222h30M206 258h28M206 294h24"/>
  </g>
  <path d="M176 70c6 40 6 200 4 250" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.55"/>

  <!-- engine skirt -->
  <path d="M166 332h68c2 16-8 28-34 32-26-4-36-16-34-32z" fill="#2b333c" stroke="#1c1630" stroke-width="6"/>
  <g fill="#111820" stroke="#1c1630" stroke-width="3">
    <ellipse cx="184" cy="348" rx="8" ry="5"/>
    <ellipse cx="200" cy="352" rx="9" ry="6"/>
    <ellipse cx="216" cy="348" rx="8" ry="5"/>
  </g>

  <!-- dust -->
  <g fill="#f2d3a2" stroke="#1c1630" stroke-width="4">
    <ellipse cx="92" cy="430" rx="28" ry="14"/>
    <ellipse cx="150" cy="446" rx="36" ry="16"/>
    <ellipse cx="250" cy="448" rx="40" ry="16"/>
    <ellipse cx="314" cy="428" rx="26" ry="13"/>
  </g>
  <g fill="#fff6d0" opacity="0.9">
    <ellipse cx="168" cy="438" rx="18" ry="8"/>
    <ellipse cx="236" cy="436" rx="16" ry="7"/>
  </g>
</svg>
